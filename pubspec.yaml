name: glass_video_editor
description: Premium glassmorphism video editor for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  video_player: ^2.9.1
  video_thumbnail: ^0.5.6
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_animate: ^4.5.0
  uuid: ^4.4.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
